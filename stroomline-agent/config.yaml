name: Stroomline Agent
version: "0.6.2"
slug: stroomline_agent
description: Connects Home Assistant to Stroomline, the home energy planner.
url: https://github.com/CalvinWalzel/stroomline-ha
arch:
  - amd64
init: false
startup: application
boot: auto
# Home Assistant API: reads states; writes only with battery_control on
# (Zendure Manager mode/power), ev_control on (Zaptec charging switch and
# phases, car charge current on fallback), a heartbeat sensor for either, and
# the watchdog automation (id stroomline_watchdog) while either is on.
homeassistant_api: true
image: ghcr.io/calvinwalzel/stroomline-agent
options:
  server_url: "https://stroomline.pixelhub.nl"
  agent_name: "Home Assistant"
  log_level: info
  influxdb_url: "http://a0d7b954-influxdb:8086"
  influxdb_database: homeassistant
  influxdb_username: stroomline_ro
  influxdb_password: ""
  battery_control: false
  battery_units: 3
  ev_control: false
  ev_charging_entity: switch.gpn006745_charging
  ev_phase_entity: number.westerloane_29_3_to_1_phase_switch_current
  ev_car_amps_entities: "number.hobbes_charge_current,number.lucky_charge_current"
  watchdog: true
  watchdog_notify: ""
schema:
  server_url: url
  agent_name: str
  log_level: list(debug|info|warn|error)
  influxdb_url: url
  influxdb_database: str
  influxdb_username: str
  influxdb_password: password?
  battery_control: bool
  battery_units: int(1,10)
  ev_control: bool
  ev_charging_entity: str
  ev_phase_entity: str
  ev_car_amps_entities: str
  watchdog: bool
  watchdog_notify: str?
