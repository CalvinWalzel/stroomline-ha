name: Stroomline Agent
version: "0.1.1"
slug: stroomline_agent
description: Connects Home Assistant to Stroomline, the home energy planner.
url: https://github.com/CalvinWalzel/stroomline-ha
arch:
  - amd64
init: false
startup: application
boot: auto
# Read-only use of the Home Assistant WebSocket API in milestone 1.
homeassistant_api: true
image: ghcr.io/calvinwalzel/stroomline-agent
options:
  server_url: "https://stroomline.pixelhub.nl"
  agent_name: "Home Assistant"
  log_level: info
schema:
  server_url: url
  agent_name: str
  log_level: list(debug|info|warn|error)
