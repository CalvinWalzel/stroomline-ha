name: Stroomline Agent
version: "0.3.0"
slug: stroomline_agent
description: Connects Home Assistant to Stroomline, the home energy planner.
url: https://github.com/CalvinWalzel/stroomline-ha
arch:
  - amd64
init: false
startup: application
boot: auto
# Home Assistant API: reads states; writes only with battery_control on
# (Zendure Manager mode/power and a heartbeat sensor).
homeassistant_api: true
image: ghcr.io/calvinwalzel/stroomline-agent
options:
  server_url: "https://stroomline.pixelhub.nl"
  agent_name: "Home Assistant"
  log_level: info
  influxdb_url: "http://a0d7b954-influxdb:8086"
  influxdb_database: homeassistant
  influxdb_username: stroomline_ro
  influxdb_password: ""
  battery_control: false
  battery_units: 3
schema:
  server_url: url
  agent_name: str
  log_level: list(debug|info|warn|error)
  influxdb_url: url
  influxdb_database: str
  influxdb_username: str
  influxdb_password: password?
  battery_control: bool
  battery_units: int(1,10)
