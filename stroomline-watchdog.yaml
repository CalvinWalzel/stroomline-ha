# Stroomline watchdog (Home Assistant automation).
#
# While battery or EV control is on, the Stroomline agent keeps
# sensor.stroomline_agent_heartbeat at the time of its last heartbeat. If that
# is more than 10 minutes old (the agent stopped or hangs), this puts the
# zendure_ha Manager back on smart, and, if the agent had EV control on, the
# Zaptec back on three phases with charging on and the cars at 16 A. Then it
# sends a push notification. After a Home
# Assistant restart it checks again after 10 minutes, since the heartbeat
# sensor only reappears once the agent sends its next beat.
#
# smart_discharging is left alone: it never charges, and it's what the
# zendure_ha patch warning automation and the agent's own lockout choose.
#
# Install: Settings → Automations & scenes → Create automation → ⋮ → Edit in
# YAML, paste this, save. Change the notify action if your phone differs.
alias: Stroomline watchdog
description: >-
  Puts the Zendure Manager back on smart, and the wallbox and cars back on
  their defaults, when the Stroomline agent stops sending heartbeats while it
  controls them.
mode: parallel
max: 5
triggers:
  - trigger: time_pattern
    minutes: /1
    id: tick
  - trigger: homeassistant
    event: start
    id: start
conditions: []
actions:
  - if:
      - condition: trigger
        id: start
    then:
      - delay: "00:10:00"
  - variables:
      heartbeat: sensor.stroomline_agent_heartbeat
      phase_entity: number.westerloane_29_3_to_1_phase_switch_current
      charging_entity: switch.gpn006745_charging
      car_amps_entities:
        - number.hobbes_charge_current
        - number.lucky_charge_current
      mode_now: "{{ states('select.zendure_manager_operation') }}"
      stale: >-
        {%- set at = as_datetime(states(heartbeat), none) -%}
        {{- (trigger.id == 'start') if at is none else (now() - at).total_seconds() > 600 -}}
      fix_battery: >-
        {{ stale and state_attr(heartbeat, 'battery_control') is not false
           and mode_now not in ['smart', 'smart_discharging'] }}
      cars_off_16: >-
        {{ car_amps_entities | select('has_value')
           | reject('is_state', '16') | reject('is_state', '16.0') | list }}
      fix_ev: >-
        {{ stale and state_attr(heartbeat, 'ev_control') == true
           and (states(phase_entity) | float(0) != 0 or is_state(charging_entity, 'off')
                or cars_off_16 | count > 0) }}
  - condition: template
    value_template: "{{ fix_battery or fix_ev }}"
  - if:
      - condition: template
        value_template: "{{ fix_battery }}"
    then:
      - action: select.select_option
        target:
          entity_id: select.zendure_manager_operation
        data:
          option: smart
  - if:
      - condition: template
        value_template: "{{ fix_ev }}"
    then:
      - action: number.set_value
        target:
          entity_id: "{{ phase_entity }}"
        data:
          value: 0
      - action: switch.turn_on
        target:
          entity_id: "{{ charging_entity }}"
      - repeat:
          for_each: "{{ cars_off_16 }}"
          sequence:
            - action: number.set_value
              target:
                entity_id: "{{ repeat.item }}"
              data:
                value: 16
  - action: notify.mobile_app_iphone
    data:
      title: Stroomline watchdog
      message: >-
        No heartbeat from the Stroomline agent for 10 minutes.
        {% if fix_battery %}The battery is back on the Zendure Manager (smart, was {{ mode_now }}).{% endif %}
        {% if fix_ev %}The wallbox is back on three phases with charging on, and the cars on 16 A.{% endif %}
